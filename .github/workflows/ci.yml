name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 가 필요한 파일:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # 통합 테스트가 빌드한 실행 파일의 커버리지는 GOSSL_COVERDIR 에 쌓인다.
      - name: Test
        env:
          GOSSL_COVERDIR: ${{ github.workspace }}/covdata
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      # 실행 파일에서 모은 것을 단위 테스트 프로파일과 합친다.
      # Execute 는 os.Exit 을 부르므로 이 경로로만 덮인다.
      - name: Merge binary coverage
        run: |
          if [ -n "$(ls -A covdata 2>/dev/null)" ]; then
            go tool covdata textfmt -i=covdata -o=binary.txt
            { echo "mode: atomic"; grep -h -v '^mode:' coverage.txt binary.txt; } > merged.txt
            mv merged.txt coverage.txt
          else
            echo "실행 파일 커버리지가 없다 - 통합 테스트가 돌지 않았다" >&2
            exit 1
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
          retention-days: 14

      - name: Build
        run: go build ./...
