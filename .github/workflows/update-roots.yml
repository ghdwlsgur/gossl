name: update-roots

# CCADB 의 루트 인증서 목록을 주기적으로 다시 생성한다.
# 바뀐 것이 있으면 PR 을 열어 사람이 확인한 뒤 머지한다.
on:
  schedule:
    - cron: "0 3 1 * *" # 매월 1일 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate bundle
        run: go run ./tools/genroots

      - name: Verify bundle
        run: go test ./internal/ -run 'TestRoot|TestWellKnown|TestDistrusted|TestIsSelfSigned'

      - name: Summarize change
        id: diff
        run: |
          if git diff --quiet config/roots.pem; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### 루트 인증서 번들 변경"
            echo '```'
            git diff --stat config/roots.pem
            echo
            echo "추가:"
            git diff config/roots.pem | grep -E '^\+# [^ ]' | sed 's/^+# /  /' || echo "  (없음)"
            echo
            echo "삭제:"
            git diff config/roots.pem | grep -E '^-# [^ ]' | sed 's/^-# /  /' || echo "  (없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-roots
          title: "chore(config): CCADB 루트 인증서 번들 갱신"
          commit-message: "chore(config): CCADB 루트 인증서 번들 갱신"
          body: |
            `tools/genroots` 가 CCADB 에서 번들을 다시 생성했습니다.

            추가·삭제된 루트는 이 실행의 job summary 에서 볼 수 있습니다.
            머지하면 다음 릴리스부터 반영됩니다.

            자동 생성된 PR 입니다.
          delete-branch: true
