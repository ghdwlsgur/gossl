version: 2
project_name: gossl
before:
  hooks:
    - go mod tidy
builds:
  - binary: gossl
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      # 예전에는 asmflags/gcflags 에 all=-trimpath={{.Env.GOPATH}} 를 줬는데
      # GOPATH 가 없는 환경에서는 템플릿이 실패한다. go 자체 플래그를 쓴다.
      - -trimpath
    ldflags:
      - -s -w
      - -X main.gosslVersion={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64      
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  github:
    owner: ghdwlsgur
    name: gossl
brews:
  - name: gossl
    homepage: "https://github.com/ghdwlsgur/gossl"
    description: "interactive CLI tool that helps to check and process the information of certificate and private key files, making it easy to apply the certificate to a web server"
    repository:
      owner: ghdwlsgur
      name: homebrew-gossl
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: ghdwlsgur
      email: vjinhyeokv@gmail.com
