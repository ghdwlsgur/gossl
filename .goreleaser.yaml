version: 2
project_name: gossl
before:
  hooks:
    - go mod tidy
builds:
  - binary: gossl
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      # 예전에는 asmflags/gcflags 에 all=-trimpath={{.Env.GOPATH}} 를 줬는데
      # GOPATH 가 없는 환경에서는 템플릿이 실패한다. go 자체 플래그를 쓴다.
      - -trimpath
    ldflags:
      - -s -w
      - -X main.gosslVersion={{.Version}}
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64      
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  github:
    owner: ghdwlsgur
    name: gossl
# formula 가 아니라 cask 로 배포한다. formula 는 원래 소스에서 빌드하는
# 패키지이고, 미리 컴파일한 바이너리를 내려받아 설치하는 것은 cask 의 몫이다.
# GoReleaser 2.10 에서 brews 가 폐기 예고되고 2.16 에서 하드 폐기됐다.
homebrew_casks:
  - name: gossl
    binaries:
      - gossl
    homepage: "https://github.com/ghdwlsgur/gossl"
    description: "Split, merge and inspect TLS certificate files, interactively or in a pipeline"
    repository:
      owner: ghdwlsgur
      name: homebrew-gossl
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: ghdwlsgur
      email: vjinhyeokv@gmail.com
    # hooks 를 쓰면 GoReleaser 가 Homebrew 에서 폐기된 postflight 스탠자를
    # 내보내 설치할 때마다 경고가 뜬다 (goreleaser#6870, 미해결). 같은 일을
    # 하는 postflight_steps 를 직접 써서 우회한다.
    #
    # 서명도 공증도 하지 않은 바이너리라 macOS 가 격리 속성을 붙인다. 떼지
    # 않으면 Gatekeeper 가 실행을 막는다. Linux 에는 xattr 이 없으므로
    # on_macos 로 감싼다. {{staged_path}} 는 Homebrew 가 실행 시점에
    # 치환하는 토큰이다 (install_steps.rb 의 expand_template_tokens).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gossl"]
        end
      end
